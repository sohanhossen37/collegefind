<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangladesh Bank Exam — College Finder</title>
<style>
  :root { color-scheme: light; --navy:#12345a; --blue:#1769aa; --bg:#f3f6fb; --ink:#172638; --muted:#64748b; --line:#dbe4ef; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(145deg,#eaf2fc 0%,var(--bg) 48%,#eef7f4 100%); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; display:grid; place-items:center; padding:24px; }
  main { width:min(100%,680px); }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:clamp(22px,5vw,40px); box-shadow:0 18px 55px rgba(23,54,89,.10); }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .mark { width:42px;height:42px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px; }
  .brand small { display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase; }
  h1 { margin:0;color:var(--navy);font-size:clamp(24px,5vw,32px);line-height:1.2; }
  .intro { color:var(--muted);margin:10px 0 26px; }
  label { display:block;font-weight:700;margin-bottom:8px; }
  .entry { display:flex;gap:10px; }
  input { flex:1;min-width:0;padding:15px 16px;border:1.5px solid #cbd7e5;border-radius:11px;font:inherit;font-size:18px;letter-spacing:.04em;outline:none; }
  input:focus { border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,170,.13); }
  button { border:0;border-radius:11px;background:var(--blue);color:white;padding:0 22px;font:700 16px system-ui;cursor:pointer; }
  button:hover { background:#10578f; }
  .hint { color:var(--muted);font-size:13px;margin:9px 0 0; }
  .result { margin-top:24px;padding:20px;border-radius:14px;background:#edf5ff;border:1px solid #d4e7fb;display:none; }
  .result.show { display:block; }
  .result.error { background:#fff3f1;border-color:#ffd8d2; }
  .result-label { color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px; }
  #college { color:var(--navy);font-size:clamp(19px,4vw,24px);font-weight:800;line-height:1.3; }
  #details { color:var(--muted);font-size:13px;margin-top:8px; }
  .footer { display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:12px; }
  @media(max-width:480px){body{padding:14px}.entry{flex-direction:column}button{padding:14px}}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="brand"><div class="mark">BB</div><div><strong>Bangladesh Bank</strong><small>Senior Officer (General) — Exam Centre Finder</small></div></div>
    <h1>Find Your Exam College</h1>
    <p class="intro">Enter your roll number to find the school or college assigned to you.</p>
    <form id="finder" novalidate>
      <label for="roll">Your roll number</label>
      <div class="entry">
        <input id="roll" name="roll" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="e.g. 100001" aria-describedby="hint">
        <button type="submit">Find College</button>
      </div>
      <p class="hint" id="hint">Enter your 6-digit roll number (100001–237923).</p>
    </form>
    <div class="result" id="result" role="status" aria-live="polite">
      <div class="result-label" id="resultLabel">Your exam centre</div>
      <div id="college"></div>
      <div id="details"></div>
    </div>
    <div class="footer"><span>Based on the uploaded Bangladesh Bank centre notice</span><span>31 exam centres</span></div>
  </section>
</main>
<script>
const centres = [
  [100001,108416,"Milestone College","Diabari, Turag, Dhaka"],
  [108417,111827,"Banani Bidyaniketan School and College","Road 23/A, Block-B, Banani Model Town, Dhaka"],
  [111828,121329,"Shamsul Hoque Khan School and College (School Campus)","Matuail, Demra, Jatrabari, Dhaka"],
  [121330,131608,"Dr. Mahbubur Rahman Molla College","Matuail, Demra Road, Jatrabari, Dhaka"],
  [131609,135226,"A. K. School & College (Main Campus)","Dania, Dhaka"],
  [135227,137300,"A. K. School & College (New Campus)","Dania, Dhaka"],
  [137301,144132,"Dania College","Dania, Jatrabari, Dhaka"],
  [144133,148159,"Barnamala Adarsha High School and College","Dania, Jatrabari, Dhaka-1236"],
  [148160,152768,"Ahmed Bawany Academy School & College","Armanitola, Babubazar, Dhaka"],
  [152770,157365,"Fazlul Haque Mohila College","12, Akshay Das Lane, Sutrapur, Gendaria, Dhaka"],
  [157366,160449,"Armanitola Government High School","Armanitola, Dhaka"],
  [160450,164456,"Mirpur Bangla School and College (Boys Section)","Section 11, Mirpur, Dhaka"],
  [164457,166402,"Mirpur Bangla School and College (Girls Section)","Section 6, Mirpur, Dhaka"],
  [166403,172044,"Mirpur College","Section-2, Mirpur, Dhaka"],
  [172045,176017,"Mirpur Girls Ideal College","Mirpur 10, Dhaka"],
  [176018,180049,"Mirpur Girls Ideal Laboratory Institute","Mirpur 10, Dhaka"],
  [180051,184589,"Kadamtala Purba Basabo School & College","28/3, Kadamtala, Basabo, Dhaka"],
  [184590,188027,"Khilgaon Girls School & College","Khilgaon, Dhaka"],
  [188028,191465,"Khilgaon Govt. High School","Khilgaon, Dhaka"],
  [191466,195476,"Khilgaon Model College","721/1, Block-C, Khilgaon, Dhaka"],
  [195477,199488,"Khilgaon School and College","711/C, Khilgaon, Dhaka"],
  [199489,201792,"Model High School","Khilgaon, Dhaka"],
  [201793,205219,"Maghbazar Girls' High School","Siddheswari, Ramna, Dhaka"],
  [205221,208662,"Mohammadpur Kendriya College","Nurjahan Road, Mohammadpur, Dhaka"],
  [208663,212673,"Lalmatiа Girls' High School & College","9/15, Block-D, Lalmatia, Dhaka"],
  [212674,215417,"Sher-E-Bangla Nagar Govt. Girls High School","Agargaon, Dhaka"],
  [215418,218832,"Dhanmondi Govt. Boys High School","03 Sobhanbagh, Mirpur Road, Dhaka"],
  [218833,221673,"Dhanmondi Government Girls High School","Dhanmondi R/A, Dhaka"],
  [221675,230825,"Tejgaon College","16, Indira Road, Farmgate, Dhaka"],
  [230826,234245,"Tejgaon Govt. High School","42, East Tejturi Bazar, Tejgaon, Dhaka"],
  [234246,237923,"Azimpur Govt. Girls School & College","Azimpur, Dhaka"]
];

const form = document.getElementById('finder');
const rollInput = document.getElementById('roll');
const result = document.getElementById('result');
const college = document.getElementById('college');
const details = document.getElementById('details');
const resultLabel = document.getElementById('resultLabel');

function findCentre(value) {
  const roll = Number(value);
  return centres.find(([start, end]) => roll >= start && roll <= end);
}
form.addEventListener('submit', (event) => {
  event.preventDefault();
  const value = rollInput.value.trim();
  result.classList.add('show');
  result.classList.remove('error');
  if (!/^\d{6}$/.test(value)) {
    result.classList.add('error');
    resultLabel.textContent = 'Invalid roll number';
    college.textContent = 'Please enter a valid 6-digit roll number.';
    details.textContent = '';
    return;
  }
  const centre = findCentre(value);
  if (!centre) {
    result.classList.add('error');
    resultLabel.textContent = 'No centre found';
    college.textContent = 'This roll number is not listed in the notice.';
    details.textContent = 'Please check the number and try again.';
    return;
  }
  resultLabel.textContent = 'Your exam centre';
  college.textContent = centre[2];
  details.textContent = `Roll: ${value}  •  Address: ${centre[3]}`;
});
rollInput.addEventListener('input', () => {
  rollInput.value = rollInput.value.replace(/\D/g, '').slice(0, 6);
});
</script>
</body>
</html>
